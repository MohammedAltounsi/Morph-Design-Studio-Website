<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
  <title id="t">Morph Design Studio, bilingual brand website</title>
  <desc id="d">Dark hero in the site's own palette: the headline LET'S MORPH!, the studio name, and the Morph pixel mark assembling from scattered orange, cyan and white squares.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090909"/><stop offset="1" stop-color="#0D2129"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.42">
      <stop offset="0" stop-color="#1B7F93" stop-opacity="0.45"/><stop offset="1" stop-color="#1B7F93" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="1200" height="420" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <rect width="1200" height="420" fill="url(#glow)"/>
    <rect width="1200" height="6" fill="#E0742B"/>
  </g>
  <g id="title-block">
    <text x="64" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="3" fill="#8FE0EE">BRAND WEBSITE · ARABIC / ENGLISH</text>
    <text x="60" y="196" font-family="Bahnschrift, 'DIN Alternate', 'DIN Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="108" fill="#F6F1E7">LET'S</text>
    <text x="60" y="296" font-family="Bahnschrift, 'DIN Alternate', 'DIN Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="108" fill="#F6F1E7">MORPH!</text>
    <text x="64" y="346" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" font-size="26" fill="#F6F1E7">Morph Design Studio</text>
    <text x="64" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#C3CED2">Arabic and English side by side in every section.</text>
  </g>
  <g id="morph-motif">
    <rect x="634" y="134" width="12" height="12" fill="#E0742B" opacity="0.25" transform="rotate(18 640 140)"/>
    <rect x="659" y="263" width="14" height="14" fill="#8FE0EE" opacity="0.3" transform="rotate(-12 666 270)"/>
    <rect x="687" y="182" width="16" height="16" fill="#FFFFFF" opacity="0.35" transform="rotate(25 695 190)"/>
    <rect x="715" y="296" width="18" height="18" fill="#8FE0EE" opacity="0.45" transform="rotate(-20 724 305)"/>
    <rect x="740" y="105" width="20" height="20" fill="#E0742B" opacity="0.55" transform="rotate(15 750 115)"/>
    <rect x="764" y="228" width="24" height="24" fill="#FFFFFF" opacity="0.65" transform="rotate(-8 776 240)"/>
    <rect x="790" y="152" width="26" height="26" fill="#8FE0EE" opacity="0.8" transform="rotate(10 803 165)"/>
    <rect x="814" y="275" width="30" height="30" fill="#E0742B" opacity="0.9" transform="rotate(-5 829 290)"/>
    <rect x="1032" y="78" width="44" height="44" fill="#8FE0EE"/>
    <rect x="1076" y="122" width="44" height="44" fill="#E0742B"/>
    <rect x="988" y="166" width="44" height="44" fill="#8FE0EE"/>
    <rect x="1032" y="166" width="44" height="44" fill="#FFFFFF"/>

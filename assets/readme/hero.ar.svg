<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
  <title id="t">مورف، موقع هوية ثنائي اللغة لاستوديو تصميم</title>
  <desc id="d">واجهة داكنة بألوان الموقع نفسه: عنوان LET'S MORPH! واسم الاستوديو، وشعار مورف المربّع يتجمّع من مربعات برتقالية وسماوية وبيضاء.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090909"/><stop offset="1" stop-color="#0D2129"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.5" r="0.42">
      <stop offset="0" stop-color="#1B7F93" stop-opacity="0.45"/><stop offset="1" stop-color="#1B7F93" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="1200" height="420" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <rect width="1200" height="420" fill="url(#glow)"/>
    <rect width="1200" height="6" fill="#E0742B"/>
  </g>
  <g id="title-block">
    <text x="1136" y="94" direction="rtl" text-anchor="start" font-family="'Segoe UI', Tahoma, 'Noto Naskh Arabic', 'Geeza Pro', 'Noto Sans Arabic', sans-serif" font-weight="600" font-size="22" fill="#8FE0EE">موقع هوية · عربي وإنجليزي</text>
    <text x="1140" y="196" text-anchor="end" font-family="Bahnschrift, 'DIN Alternate', 'DIN Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="108" fill="#F6F1E7">LET'S</text>
    <text x="1140" y="296" text-anchor="end" font-family="Bahnschrift, 'DIN Alternate', 'DIN Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="108" fill="#F6F1E7">MORPH!</text>
    <text x="1136" y="346" direction="rtl" text-anchor="start" font-family="'Segoe UI', Tahoma, 'Noto Naskh Arabic', 'Geeza Pro', 'Noto Sans Arabic', sans-serif" font-weight="700" font-size="28" fill="#F6F1E7">مورف · استوديو تصميم</text>
    <text x="1136" y="384" direction="rtl" text-anchor="start" font-family="'Segoe UI', Tahoma, 'Noto Naskh Arabic', 'Geeza Pro', 'Noto Sans Arabic', sans-serif" font-size="23" fill="#C3CED2">عربي وإنجليزي في كل قسم، على الشاشة الكبيرة والجوال.</text>
  </g>

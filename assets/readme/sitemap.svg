    <text x="24" y="106" text-anchor="start" font-family="Bahnschrift, 'DIN Alternate', 'DIN Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="34" fill="#F6F1E7">Projects</text>
    <text x="226" y="150" direction="rtl" text-anchor="start" font-family="'Segoe UI', Tahoma, 'Noto Naskh Arabic', 'Geeza Pro', 'Noto Sans Arabic', sans-serif" font-weight="600" font-size="28" fill="#8FE0EE">أعمالنا</text>

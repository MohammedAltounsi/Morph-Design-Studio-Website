    <rect x="944" y="254" width="44" height="44" fill="#FFFFFF"/>
    <rect x="988" y="254" width="44" height="44" fill="#8FE0EE"/>
    <rect x="1076" y="254" width="44" height="44" fill="#FFFFFF"/>
    <rect x="1032" y="298" width="44" height="44" fill="#FFFFFF"/>
  </g>
</svg>
